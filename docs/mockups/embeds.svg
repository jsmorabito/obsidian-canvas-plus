      <text x="108" y="206" font-size="22" font-weight="700" text-anchor="start" class="t">12.4k</text><rect x="238" y="152" width="130" height="70" rx="8" class="surface-alt"/>
      <text x="252" y="176" font-size="11.5" font-weight="400" text-anchor="start" class="tm">Signups</text>
      <text x="252" y="206" font-size="22" font-weight="700" text-anchor="start" class="t">842</text><rect x="382" y="152" width="130" height="70" rx="8" class="surface-alt"/>
      <text x="396" y="176" font-size="11.5" font-weight="400" text-anchor="start" class="tm">Churn</text>
      <text x="396" y="206" font-size="22" font-weight="700" text-anchor="start" class="t">1.8%</text>
    <rect x="102" y="346" width="30" height="40" rx="4" class="a" opacity="0.35"/><rect x="154" y="316" width="30" height="70" rx="4" class="a" opacity="0.43"/><rect x="206" y="334" width="30" height="52" rx="4" class="a" opacity="0.51"/><rect x="258" y="290" width="30" height="96" rx="4" class="a" opacity="0.59"/><rect x="310" y="306" width="30" height="80" rx="4" class="a" opacity="0.6699999999999999"/><rect x="362" y="268" width="30" height="118" rx="4" class="a" opacity="0.75"/><rect x="414" y="286" width="30" height="100" rx="4" class="a" opacity="0.83"/><rect x="466" y="250" width="30" height="136" rx="4" class="a" opacity="0.91"/>
    <path d="M450 266l0 17l4.5-4.2l3 6.6l2.6-1.2l-3-6.4l6.1-.3z" fill="#111" stroke="#fff" stroke-width="1.3" stroke-linejoin="round"/>
    <text x="590" y="64" font-size="12.5" font-weight="400" text-anchor="start" class="tf">Linear</text>
    <rect x="590" y="76" width="300" height="330" rx="8" class="surface" filter="url(#sh)"/>
    <text x="608" y="108" font-size="14" font-weight="700" text-anchor="start" class="t">On canvas</text>
    <rect x="604" y="122" width="272" height="30" rx="8" class="surface-alt"/><use href="#i-search" x="614" y="129" width="15" height="15" class="cf"/><text x="636" y="142" font-size="12" font-weight="400" text-anchor="start" class="tf">Search issues</text>
    <rect x="604" y="168" width="272" height="64" rx="8" class="surface-alt"/>
        <text x="616" y="190" font-size="11" font-weight="600" text-anchor="start" class="tf">ENG-142</text>
        <text x="616" y="208" font-size="12.5" font-weight="500" text-anchor="start" class="t">Sync drops edits on reconnect</text>
        <rect x="616" y="214" width="78.69999999999999" height="18.5" rx="9.25" class="asoft"/><text x="655.35" y="226" font-size="9.5" font-weight="600" text-anchor="middle" class="a">In progress</text><rect x="604" y="242" width="272" height="64" rx="8" class="surface-alt"/>
        <text x="616" y="264" font-size="11" font-weight="600" text-anchor="start" class="tf">ENG-151</text>
        <text x="616" y="282" font-size="12.5" font-weight="500" text-anchor="start" class="t">Add share links to canvases</text>
        <rect x="616" y="288" width="38.8" height="18.5" rx="9.25" class="asoft"/><text x="635.4" y="300" font-size="9.5" font-weight="600" text-anchor="middle" class="a">Todo</text><rect x="604" y="316" width="272" height="64" rx="8" class="surface-alt"/>
        <text x="616" y="338" font-size="11" font-weight="600" text-anchor="start" class="tf">ENG-158</text>
        <text x="616" y="356" font-size="12.5" font-weight="500" text-anchor="start" class="t">Minimap blank on first open</text>
        <rect x="616" y="362" width="38.8" height="18.5" rx="9.25" class="asoft"/><text x="635.4" y="374" font-size="9.5" font-weight="600" text-anchor="middle" class="a">Done</text>
  
</g>
<rect x=".5" y=".5" width="959" height="519" rx="14" class="line"/>
</svg>
