    .bar-t { fill: #3e3e45; } .bar-f { fill: #33333a; }
    .c { color: #e4e4e9; } .cm { color: #a0a0ab; } .cf { color: #6d6d78; } .ca { color: #9b83ff; }
    .a { fill: #8f76ff; } .as { stroke: #8f76ff; } .asoft { fill: #8f76ff; fill-opacity: .16; }
    .on-a { fill: #ffffff; }
    .hl-yellow { stroke-opacity: .3; }
