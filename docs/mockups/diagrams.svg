  .gfill { fill: #ffffff; fill-opacity: .6; }
  .o-fill { fill: #f6e5dc; stroke: #d9a184; stroke-width: 1.2; } .o-t { fill: #a8461a; }
  .chrome { fill: #ececf0; } .ink-dark { stroke: #222228; }
  @media (prefers-color-scheme: dark) {
