<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Presenting a canvas stop by stop">
<title>Presenting a canvas stop by stop</title>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
  .bg { fill: #f6f6f8; } .dot { fill: #d6d6dd; }
  .surface { fill: #ffffff; stroke: #e2e2e8; stroke-width: 1; }
  .surface-alt { fill: #f3f3f6; stroke: #e2e2e8; stroke-width: 1; }
  .fill-surface { fill: #ffffff; } .fill-alt { fill: #f3f3f6; } .fill-hover { fill: #ececf1; }
  .line { stroke: #e2e2e8; fill: none; } .line-strong { stroke: #b9b9c4; fill: none; }
  .t { fill: #222228; } .tm { fill: #6c6c78; } .tf { fill: #a2a2ae; }
  .bar-t { fill: #dcdce3; } .bar-f { fill: #ececf1; }
  .c { color: #222228; } .cm { color: #6c6c78; } .cf { color: #a2a2ae; } .ca { color: #7655f0; }
  .a { fill: #7655f0; } .as { stroke: #7655f0; fill: none; } .asoft { fill: #7655f0; fill-opacity: .1; }
  .on-a { fill: #ffffff; }
  .ink-red { stroke: #e93147; } .ink-green { stroke: #08b94e; }
  .hl-yellow { stroke: #f5c400; stroke-opacity: .38; }
  .shadow { flood-color: #1b1b30; flood-opacity: .08; }
  .gfill { fill: #ffffff; fill-opacity: .6; }
  .o-fill { fill: #f6e5dc; stroke: #d9a184; stroke-width: 1.2; } .o-t { fill: #a8461a; }
  .chrome { fill: #ececf0; } .ink-dark { stroke: #222228; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1c1c1f; } .dot { fill: #38383e; }
    .surface { fill: #26262a; stroke: #36363c; }
    .surface-alt { fill: #2d2d32; stroke: #36363c; }
    .fill-surface { fill: #26262a; } .fill-alt { fill: #2d2d32; } .fill-hover { fill: #34343a; }
    .line { stroke: #36363c; } .line-strong { stroke: #55555e; }
    .t { fill: #e4e4e9; } .tm { fill: #a0a0ab; } .tf { fill: #6d6d78; }
    .bar-t { fill: #3e3e45; } .bar-f { fill: #33333a; }
    .c { color: #e4e4e9; } .cm { color: #a0a0ab; } .cf { color: #6d6d78; } .ca { color: #9b83ff; }
    .a { fill: #8f76ff; } .as { stroke: #8f76ff; } .asoft { fill: #8f76ff; fill-opacity: .16; }
    .on-a { fill: #ffffff; }
    .hl-yellow { stroke-opacity: .3; }
    .shadow { flood-color: #000000; flood-opacity: .35; }
    .gfill { fill: #ffffff; fill-opacity: .025; }
    .o-fill { fill: #3a2a22; stroke: #8a5235; } .o-t { fill: #f0a274; }
    .chrome { fill: #161618; } .ink-dark { stroke: #e4e4e9; }
  }
  .ic { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
</style>
<defs>
    <symbol id="i-present" viewBox="0 0 24 24" class="ic"><path d="M2 3h20"/><path d="M21 3v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V3"/><path d="m7 21 5-5 5 5"/></symbol><symbol id="i-left" viewBox="0 0 24 24" class="ic"><path d="m15 18-6-6 6-6"/></symbol><symbol id="i-right" viewBox="0 0 24 24" class="ic"><path d="m9 18 6-6-6-6"/></symbol><symbol id="i-more" viewBox="0 0 24 24" class="ic"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></symbol><symbol id="i-check" viewBox="0 0 24 24" class="ic"><path d="M20 6 9 17l-5-5"/></symbol><symbol id="i-back" viewBox="0 0 24 24" class="ic"><path d="m12 19-7-7 7-7M19 12H5"/></symbol><symbol id="i-fwd" viewBox="0 0 24 24" class="ic"><path d="M5 12h14M12 5l7 7-7 7"/></symbol>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" class="dot"/></pattern>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="8" class="shadow"/></filter>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9c7ff"/><stop offset="1" stop-color="#e9d8ff"/></linearGradient>
    <linearGradient id="dusk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd1b3"/><stop offset="1" stop-color="#f6a8c4"/></linearGradient>
    <clipPath id="frame"><rect width="960" height="520" rx="14"/></clipPath>
  </defs>
<g clip-path="url(#frame)">
  <rect width="960" height="520" class="bg"/>
  <rect width="960" height="520" fill="url(#dots)"/>
  
    <rect width="960" height="44" class="fill-surface"/>
    <line x1="0" y1="44" x2="960" y2="44" class="line"/>
    <rect y="0" width="960" height="44" class="fill-surface"/>
    <line x1="0" y1="44" x2="960" y2="44" class="line"/>
    <use href="#i-back" x="18" y="13" width="18" height="18" class="cf"/><use href="#i-fwd" x="46" y="13" width="18" height="18" class="cf"/>
    <text x="80" y="27" font-size="14" font-weight="500" text-anchor="start" class="t">Roadmap</text>
    <rect x="876" y="7" width="30" height="30" rx="7" class="asoft"/>
    <use href="#i-present" x="882" y="13" width="18" height="18" class="ca"/>
    <use href="#i-more" x="918" y="13" width="18" height="18" class="cm"/>
    <text x="96" y="112" font-size="34" font-weight="700" text-anchor="start" class="t">Q4 roadmap</text>
    <text x="98" y="142" font-size="15" font-weight="400" text-anchor="start" class="tm">Three bets for the quarter</text>
    <rect x="96" y="170" width="240" height="108" rx="10" class="surface" filter="url(#sh)"/>
    
    <text x="112" y="198" font-size="14" font-weight="600" text-anchor="start" class="t">Faster sync</text>
    <rect x="112" y="214" width="190" height="6" rx="3" class="bar-t"/><rect x="112" y="228" width="160" height="6" rx="3" class="bar-t"/><rect x="112" y="242" width="120" height="6" rx="3" class="bar-t"/><rect x="112" y="256" width="140" height="6" rx="3" class="bar-t"/>
    <rect x="360" y="170" width="240" height="108" rx="10" class="surface" filter="url(#sh)"/>
    
    <text x="376" y="198" font-size="14" font-weight="600" text-anchor="start" class="t">Shared canvases</text>
    <rect x="376" y="214" width="180" height="6" rx="3" class="bar-t"/><rect x="376" y="228" width="170" height="6" rx="3" class="bar-t"/><rect x="376" y="242" width="100" height="6" rx="3" class="bar-t"/><rect x="376" y="256" width="150" height="6" rx="3" class="bar-t"/>
    <rect x="624" y="170" width="240" height="108" rx="10" class="surface" filter="url(#sh)"/>
    
    <text x="640" y="198" font-size="14" font-weight="600" text-anchor="start" class="t">Mobile ink</text>
    <rect x="640" y="214" width="170" height="6" rx="3" class="bar-t"/><rect x="640" y="228" width="190" height="6" rx="3" class="bar-t"/><rect x="640" y="242" width="130" height="6" rx="3" class="bar-t"/><rect x="640" y="256" width="90" height="6" rx="3" class="bar-t"/>
    <rect x="380" y="284" width="200" height="162" rx="10" class="surface" filter="url(#sh)"/><text x="398" y="309" font-size="12" font-weight="600" text-anchor="start" class="tf">1</text><text x="420" y="309" font-size="13" font-weight="400" text-anchor="start" class="t">Intro</text><rect x="386" y="320" width="188" height="28" rx="6" class="asoft"/><use href="#i-check" x="550" y="327" width="14" height="14" class="ca"/><text x="398" y="339" font-size="12" font-weight="600" text-anchor="start" class="tf">2</text><text x="420" y="339" font-size="13" font-weight="600" text-anchor="start" class="a">Q4 roadmap</text><text x="398" y="369" font-size="12" font-weight="600" text-anchor="start" class="tf">3</text><text x="420" y="369" font-size="13" font-weight="400" text-anchor="start" class="t">Research</text><text x="398" y="399" font-size="12" font-weight="600" text-anchor="start" class="tf">4</text><text x="420" y="399" font-size="13" font-weight="400" text-anchor="start" class="t">Design</text><text x="398" y="429" font-size="12" font-weight="600" text-anchor="start" class="tf">5</text><text x="420" y="429" font-size="13" font-weight="400" text-anchor="start" class="t">Launch</text>
    <rect x="396" y="456" width="168" height="44" rx="8" class="surface" filter="url(#sh)"/>
    <path d="M444 456v44M516 456v44" class="line"/>
    <use href="#i-left" x="410" y="468" width="20" height="20" class="cm"/>
    <text x="480" y="483" font-size="14" font-weight="500" text-anchor="middle" class="t">2 / 5</text>
    <use href="#i-right" x="530" y="468" width="20" height="20" class="cm"/>
  
</g>
<rect x=".5" y=".5" width="959" height="519" rx="14" class="line"/>
</svg>
